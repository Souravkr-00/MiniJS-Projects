<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice roll</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1{
            text-align: center;
            margin-top: 20px;
            margin-bottom: 2rem;
        }
        .dice{
            width: 10rem;
            margin: 0 auto;
            
        }
        .dice img{
            width: 100%;
           
        }
        .roll-btn{
            text-align: center;
            margin-top: 2rem;
        }
        .roll-btn button{
            padding: 0.5rem 1rem;
            font-size: 1rem;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        

#dice-img {
    width: 100%;
    height: 100%;
    transition: transform 1s ease-in-out;
}

/* Rolling animation */
#dice-img {
    animation: roll 1s ease-in-out;
}

@keyframes roll {
    0% {
        transform: rotateX(0) rotateY(0);
    }
    25% {
        transform: rotateX(180deg) rotateY(0);
    }
    50% {
        transform: rotateX(180deg) rotateY(180deg);
    }
    75% {
        transform: rotateX(0) rotateY(180deg);
    }
    100% {
        transform: rotateX(360deg) rotateY(360deg);
    }
}
.results-container{
    width: 60%;
    margin: 0 auto;
}
.results{
    width: 100%;
    list-style: none;
    padding: 0.2rem;
    /* border: 1px solid #333; */
    border-radius: 5px;
}
.results li{
    padding: 0.5rem;
    border-bottom: 1px solid #333;
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 5rem;
    margin-top: 1rem;
}
.results li img{
    width: 50px;
    height: 50px;
   
}
    </style>
</head>

<body>
    <h1>Dice Roll Game</h1>
    <div class="dice">
        <img id = "dice-img" src="./images/dice-1.png" alt="">
    </div>
    <div class="roll-btn">
        <button >Roll Dice</button>
    </div>
    
    <div class="results-container">
        <h2 style=" margin-top: 1rem;">Results</h2>
        <ul class="results">
            
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
