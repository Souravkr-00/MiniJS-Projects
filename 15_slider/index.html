<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .img-container {
            width: 70%;
            height: 500px;
            overflow: hidden;
            position: relative;
        }
        .img-container img {
            width: 100%;
            transition: opacity 0.5s;
        }
        .img-container img.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="img-container">
            <img src="images/banner1.jpg" alt="">
        </div>
        <div class="buttons">
            <button id="prev">Prev</button>
            <button id="next">Next</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
