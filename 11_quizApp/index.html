<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <h1 class="heading">Quiz App</h1>
        <h2 class="question">Q.1 How are You?</h2>
        <div class="options">
            <button class="option">Good</button>
            <button class="option">Very Good</button>
            <button class="option">Excellent</button>
            <button class="option">Bad</button>
        </div>
        <div class="move-btns">
            <button class="prev-btn">Prev</button>
            <button class="next-btn">Next</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
